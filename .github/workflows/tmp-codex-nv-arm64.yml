name: tmp-codex-nv-arm64

on:
  push:
    branches:
      - 'tmp/codex-nv-arm64-20260911'
    paths:
      - '.github/workflows/tmp-codex-nv-arm64.yml'

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      TARGET: aarch64-unknown-linux-musl
      RUST_MIN_STACK: '16777216'
      AWS_LC_SYS_NO_JITTER_ENTROPY: '1'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout tested tri-wire Codex source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Xxx91n/codex.git codex-src
          cd codex-src
          git checkout f5feccf513a6d5cfe8c12b3df465d0f4f79d0313
          git rev-parse HEAD

      - name: Apply Kimi K3 native max reasoning defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('codex-src/codex-rs/core/src/client/wire/chat.rs')
          s = p.read_text()
          needle = '''        Ok(request)\n    }\n}\n\n/// Converts Responses-shaped conversation items into Chat Completions\n'''
          repl = '''        // Codex-NV: NVIDIA Kimi K3 supports its native max tier.\n        if model_info.slug == "moonshotai/kimi-k3"\n            && let Some(obj) = request.as_object_mut()\n        {\n            obj.insert(\n                "reasoning_effort".to_string(),\n                serde_json::Value::String("max".to_string()),\n            );\n            obj.insert("temperature".to_string(), json!(1.0));\n            obj.insert("max_tokens".to_string(), json!(16_384));\n        }\n\n        Ok(request)\n    }\n}\n\n/// Converts Responses-shaped conversation items into Chat Completions\n'''
          if s.count(needle) != 1:
              raise SystemExit(f'patch anchor mismatch: {s.count(needle)}')
          p.write_text(s.replace(needle, repl))
          PY

      - name: Install Codex-pinned Rust ARM64 musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false

      - name: Install Codex musl build tools
        shell: bash
        run: |
          set -euo pipefail
          rustup target list --toolchain 1.95.0 --installed | grep -Fx "$TARGET"
          TARGET="$TARGET" bash "$GITHUB_WORKSPACE/codex-src/.github/scripts/install-musl-build-tools.sh"

      - name: Build canonical ARM64 musl package
        shell: bash
        working-directory: codex-src
        run: |
          set -euo pipefail
          export CODEX_REPO_ROOT="$GITHUB_WORKSPACE/codex-src"
          python3 scripts/build_codex_package.py \
            --target "$TARGET" \
            --cargo-profile release \
            --package-dir "$GITHUB_WORKSPACE/out/Codex-NV" \
            --force

      - name: Add NVIDIA Kimi config and Termux launchers
        shell: bash
        run: |
          set -euo pipefail
          cat > out/Codex-NV/config.toml <<'EOF'
          model = "moonshotai/kimi-k3"
          model_provider = "nvidia"
          model_reasoning_effort = "max"

          [model_providers.nvidia]
          name = "NVIDIA NIM - Kimi K3"
          base_url = "https://integrate.api.nvidia.com/v1"
          wire_api = "chat"
          env_key = "NV_C1"
          request_max_retries = 4
          stream_max_retries = 5
          stream_idle_timeout_ms = 300000
          supports_websockets = false
          requires_openai_auth = false
          EOF

          cat > out/Codex-NV/codex-nv <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          set -e
          export CODEX_HOME="${CODEX_HOME:-$HOME/.codex-nvidia}"
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$ROOT/bin/codex" "$@"
          EOF
          chmod +x out/Codex-NV/codex-nv

          cat > out/Codex-NV/install-termux.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          set -euo pipefail
          SRC="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          DEST="$HOME/.local/lib/codex-nv"
          BIN="$HOME/.local/bin"
          HOME_NV="$HOME/.codex-nvidia"
          mkdir -p "$DEST" "$BIN" "$HOME_NV"
          cp -R "$SRC"/* "$DEST"/
          cp "$SRC/config.toml" "$HOME_NV/config.toml"
          cat > "$BIN/codex-nv" <<LAUNCH
          #!/data/data/com.termux/files/usr/bin/bash
          export CODEX_HOME="$HOME_NV"
          exec "$DEST/bin/codex" "\$@"
          LAUNCH
          chmod +x "$BIN/codex-nv"
          if ! grep -Fq '$HOME/.local/bin' "$HOME/.bashrc" 2>/dev/null; then
            printf '\nexport PATH="$HOME/.local/bin:$PATH"\n' >> "$HOME/.bashrc"
          fi
          echo "Installed: $BIN/codex-nv"
          echo "Run: source ~/.bashrc && codex-nv"
          EOF
          chmod +x out/Codex-NV/install-termux.sh

          tar -C out -czf out/codex-nv-android-arm64.tar.gz Codex-NV
          sha256sum out/codex-nv-android-arm64.tar.gz | tee out/SHA256SUMS.txt

      - name: Native ARM64 smoke test
        shell: bash
        run: |
          set -euo pipefail
          file out/Codex-NV/bin/codex
          out/Codex-NV/bin/codex --version
          uname -m

      - name: Upload ARM64 Termux package
        uses: actions/upload-artifact@v4
        with:
          name: codex-nv-android-arm64
          path: |
            out/codex-nv-android-arm64.tar.gz
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
